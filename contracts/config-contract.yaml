# 配置契约：输入输出、合并优先级、必填项与报错。
# 这是规范文档，不是渲染器。修改规则后应同步更新技能正文与 examples。
contract_version: "1.1"
config_schema_version: "1.0"

merge:
  description: >
    后者覆盖前者的同名配置。锁定规则在合并后检查，冲突则报错，不能被覆盖为更弱的值。
  order:
    - optional_presets
    - style_pack
    - project_overrides
  locked_after_merge: safety_baseline
  normalization: >
    style_pack 的可配置正文及 style.overrides 合并到有效配置 packaging；
    id/version/compatible_config_versions/status 等注册元数据不接受项目覆盖。
    项目 qa/sync/privacy 保持各自命名空间。缺省锁定键采用 safety_baseline 的 required_value，
    任一输入若显式冲突即报错，不用后层覆盖来掩盖。未使用新可选字段的 1.0 项目仍有效。

safety_baseline:
  description: 风格包与项目覆盖都不能削弱这些规则。
  rules:
    - key: qa.require_direct_video_review
      required_value: true
    - key: qa.if_no_direct_review
      required_value: "pending-preview-only"
    - key: qa.never_auto_publish
      required_value: true
    - key: qa.never_claim_perfect_frame_accuracy
      required_value: true
    - key: qa.never_claim_watched_without_review
      required_value: true
    - key: sync.single_speed_required
      required_value: true
    - key: sync.forbid_padding_to_mask_desync
      required_value: true
    - key: sync.retranscribe_on_final_dry_voice
      required_value: true
    - key: packaging.content_plan_has_priority
      required_value: true
    - key: packaging.no_fixed_card_frequency_requirement
      required_value: true
    - key: privacy.no_absolute_or_private_paths_in_shared_files
      required_value: true

# 1.1 是可选扩展契约；项目 schema 仍为 1.0，不改变已有必填项。
optional_packaging_fields:
  broll.presentation:
    enum: [scene-plan, windowed, full-bleed]
    default: scene-plan
  broll.fit:
    enum: [cover, contain]
    default: cover
  broll.crop_policy:
    enum: [per-shot-subject-anchor]
    default: per-shot-subject-anchor
  broll.speaker_overlay:
    enum: [scene-plan, small-circle, none]
    default: scene-plan
  broll.background:
    enum: [scene-plan, source-only]
    default: scene-plan
  broll.padding:
    type: boolean
    default: false
  disclosure.policy:
    enum: [risk-based]
    default: risk-based
  disclosure.clean_preference:
    type: boolean
    default: false
  disclosure.provenance_manifest_required:
    enum: [true]
    default: true

conditional_validation:
  full_bleed:
    when: "packaging.broll.presentation == full-bleed"
    require:
      packaging.broll.fit: cover
      packaging.broll.background: source-only
      packaging.broll.padding: false
    checks:
      - 每镜等比主体锚定覆盖整个目标画布，无素材窗框、底纹、拉伸或模糊补边。
      - 记录源宽高、归一化裁切框/锚点、缩放与取舍；保不住核心活动时换素材或取得构图变更确认。
  disclosure:
    policy: >
      clean_preference 只是偏好，不是关闭必要披露的开关。按误导风险、法律/平台要求决定上屏说明；
      若不说明会实质误导，换素材、改表达或保留必要说明，不能只藏入文档。
      不默认给所有通用库存/抽象图形加标签；正常字幕、标题、章节、关键词和流程信息不属于待清理说明。
    manifest_when_assets_used:
      - source_id_or_url
      - license_evidence_and_limitations
      - nature_and_permitted_use
      - source_interval_and_output_frames
      - crop_and_disclosure_decision
    factual_limit: 不冒充用户经历、活动、官方界面或客户成果，不将个人概念数字包装成已证实统计。
  visual_only_revision:
    preserve: [base_video, final_dry_voice, sentence_subtitles, segments, frame_map]
    checks:
      - 用音轨基本流或解码样本、字幕及时间轴一致性检查佐证未改声音/文案/时间轴；不要求整文件hash相同。
      - 仅在这些输入未变时复用已有终速字幕，不再次ASR或变速；改变音频链、切点、语速时重做受影响检查。
      - sync.retranscribe_on_final_dry_voice 仍为true，指首次建立或改变终速干声，不强迫纯视觉修订重复转写。
      - 新版本保留旧版；失效并刷新所有受影响缓存块。
  current_version_review:
    required_for_passed: [reviewed_artifact_checksum, current_version, full_timeline_scope, reviewed_at, observations, uncompleted_checks]
    checks:
      - 对最终成片或完整同时间轴代理完整动态直接审片，记录实际对象/校验值；旧版PASS不能继承。
      - 信号/像素诊断与审片观察分开，截图/ASR/哈希不代替视听，不保证完美逐帧。

required_project_fields:
  - config_schema_version
  - project.id
  - style.id
  - edit.speed
  - edit.output.width
  - edit.output.height
  - edit.output.fps
  - qa.require_direct_video_review

required_style_fields:
  - id
  - version
  - compatible_config_versions
  - status
  - applies_to
  - does_not_apply
  - colors
  - typography.family_stack
  - typography.fallbacks
  - layout_coordinate_space
  - safe_area
  - subtitles
  - talking_head
  - cards
  - motion
  - sfx
  - bgm
  - ending
  - assets

allowed_style_status:
  - template
  - draft
  - confirmed
  - verified-sample

style_status_rules:
  template: 不可被项目选为出片风格。只能复制后改 id 再使用。
  draft: 可以使用，但交付时必须标明风格尚未验证。
  confirmed: 表示某使用方已确认采用，不自动等于本仓库的已验证样片。
  verified-sample: 仅用于仓库中有已验证样片依据的风格。当前只应有 black-neon-talking-head。

io:
  qc_skill:
    inputs:
      - project_config
      - optional_presets
      - source_media_via_local_locator
    outputs:
      - probe_report
      - content_plan
      - segments
      - frame_map
      - dry_voice_source_speed
      - dry_voice_final_speed
      - base_video_unpacked
      - sentence_subtitles_final_timeline
      - qa_notes
  packaging_skill:
    inputs:
      - all_qc_outputs
      - project_config
      - style_pack
      - optional_presets
    outputs:
      - resolved_config_snapshot
      - scene_table
      - packaged_master_or_preview
      - qa_notes
      - review_status
    optional_outputs: [asset_manifest, revision_checks, review_evidence]
  review_status_values:
    - passed
    - pending-preview
  notes:
    - 内容剪辑计划是包装的前置输入，包装不得另写一套与之冲突的时间轴。
    - 共享文件只使用相对仓库根目录的路径，分隔符为 /。
    - 本机媒体路径只出现在不共享的本地定位文件中，不写入风格包。

errors:
  - code: MISSING_REQUIRED_FIELD
    when: 项目或风格缺少必填项
  - code: UNKNOWN_STYLE_ID
    when: style.id 未在 styles/catalog.yaml 注册，或注册路径不存在
  - code: TEMPLATE_STYLE_SELECTED
    when: 项目选择了 status 为 template 的风格，或 id 为 _blank-template
  - code: INCOMPATIBLE_SCHEMA
    when: 项目 config_schema_version 与风格 compatible_config_versions 不交集
  - code: LOCKED_KEY_VIOLATION
    when: 风格或项目覆盖试图削弱 safety_baseline
  - code: MULTIPLE_SPEED_VALUES
    when: 出现一个以上有效 SPEED，或音画准备使用不同语速
  - code: ABSOLUTE_OR_PRIVATE_PATH
    when: 共享配置中出现绝对路径、盘符路径或明显的本机用户目录
  - code: FONT_PATH_NOT_FAMILY
    when: typography 使用字体文件路径而不是字体族名称
  - code: LAYOUT_NOT_RELATIVE
    when: 布局使用绝对像素且未提供相对画幅比例
  - code: FIXED_CARD_FREQUENCY
    when: 风格把固定弹卡间隔写成必须执行的包装规则
  - code: UNVERIFIED_STYLE_AS_VERIFIED
    when: 把 draft 或 confirmed 风格宣传为仓库已验证样片
  - code: MISSING_CONTENT_PLAN
    when: 进入包装时没有内容剪辑计划
  - code: REVIEW_SKIPPED
    when: 未做直接视听审片却把状态写成 passed，或声称已看

  - code: STYLE_VERSION_MISMATCH
    when: 项目显式style.version与实际加载样式版本不同，不得静默忽略钉扎
  - code: INVALID_OPTIONAL_FIELD
    when: 新可选字段的值或类型不在声明范围，不能按拼写错误静默回退
  - code: FULL_BLEED_CONFLICT
    when: 明确要求满屏却配置窗口/补边/非cover或输出不覆盖整个目标画布
  - code: MISSING_ASSET_EVIDENCE
    when: 使用素材却缺来源、许可依据/局限、性质、源区间或最终帧记录
  - code: DISCLOSURE_CONFLICT
    when: 干净偏好被用于豁免必要披露，或素材/图表造成未经消歧的事实误导
  - code: REVISION_INVARIANT_BROKEN
    when: 声称纯视觉修订却改变声音、字幕、映射或重复变速而未重建相应对齐
  - code: STALE_REVIEW
    when: 新终版沿用旧版PASS或缺少当前完整动态直接审片证据

on_error:
  action: 停止出片交付
  deliver: 指出错误代码、字段路径和如何修正
  do_not: 用默认值悄悄补上锁定规则所禁止的项，或继续当作审片通过
