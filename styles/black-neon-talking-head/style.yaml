# 唯一已验证样片风格。下列数值是该风格的可配置起点，
# 仍须按当次人脸、标题和目标手机安全区重测，不是所有项目的硬规范。
id: black-neon-talking-head
version: "1.1.0"
compatible_config_versions:
  min: "1.0"
  max_exclusive: "2.0"
status: verified-sample
summary: 近黑背景、克制点阵、荧光绿描边人物窗、句级白色粗字幕，以及稀疏人声主导的声音策略。

applies_to:
  - 对镜头口播的短视频包装
  - 需要人物窗、关键词/章节/流程类信息卡和句级字幕的成片
does_not_apply:
  - 未完成音画对齐的素材
  - 需要把本风格当作所有品牌默认视觉系统的场合
  - 要用固定弹卡频率代替内容计划的场合

layout_coordinate_space:
  type: "frame-relative"
  origin: "top-left"
  x: "ratio-of-width"
  y: "ratio-of-height"
  notes: "禁止把某次样片的绝对像素坐标当作可复用规范。"

colors:
  background:
    rgb: [10, 10, 10]
    fallback_rgb: [0, 0, 0]
  grid:
    rgb: [34, 34, 34]
    fallback_rgb: [24, 24, 24]
  accent:
    rgb: [30, 222, 6]
    fallback_rgb: [40, 200, 40]
  white:
    rgb: [255, 255, 255]
    fallback_rgb: [245, 245, 245]

typography:
  resolve_policy: "family-name-only"
  family_stack:
    - "licensed-sans-cjk-bold"
  fallbacks:
    - "generic-sans-cjk-bold"
    - "generic-sans-cjk"
  on_missing_preferred: "use-next-fallback-and-record-warning"
  on_missing_all: "error"
  subtitles:
    color_ref: white
    weight: "bold"
    unit: "sentence"
    soft_shadow: true
    word_by_word_highlight: false
  title:
    lines: 2
    color_split_refs: [accent, white]
    soft_shadow: true
    max_width_ratio: 0.55
    persistent: true
    placement:
      x_center_ratio: 0.5
      top_ratio_starting_hint: 0.16
      y_policy: "below-device-and-platform-safe-area"
      must_measure_on_target_devices: true
      do_not_copy_legacy_flush_top: true

safe_area:
  modes:
    - letterbox
    - fill-crop
  check:
    - top-status-and-platform-bar
    - right-interaction-column
    - bottom-caption-and-gesture-area
    - left-and-right-fill-crop
  title_must_clear_top_chrome: true
  keep_crown_visible: true
  device_chrome_values_are_not_constants: true

talking_head:
  keep_crown: true
  recompute_from_face_each_source: true
  outline:
    color_ref: accent
    corner: rounded
    weight_ratio_of_min_side: 0.004
  layouts:
    large: { x: 0.12, y: 0.20, w: 0.76, h: 0.62, shape: rounded-rect }
    circle: { x: 0.22, y: 0.22, w: 0.56, h: 0.42, shape: circle }
    left: { x: 0.06, y: 0.22, w: 0.46, h: 0.58, shape: rounded-rect }
    small: { x: 0.28, y: 0.30, w: 0.44, h: 0.38, shape: rounded-rect }
    low: { x: 0.14, y: 0.36, w: 0.72, h: 0.48, shape: rounded-rect }
    fullscreen: { x: 0.00, y: 0.00, w: 1.00, h: 1.00, shape: full }
  allow_micro_push_in: false
  no_default_top_right_watermark: true
  nameplate:
    lines: []
    avoid_face: true

subtitles: { ref: typography.subtitles }

cards:
  types_available:
    - keyword
    - chapter
    - process-or-topic
  placement_policy: "follow-content-plan"
  no_fixed_interval_sec: true
  must_not_cover_face_or_subtitles: true

motion:
  easing_start_sec_hint: 0.4
  motion_must_not_interrupt_information: true

sfx:
  policy: "sparse-quiet-key-moments-only"
  voice_led: true
  force_on_every_card: false

bgm:
  source_policy: "licensed-or-original-instrumental-only"
  lyrics: false
  must_not_mask_voice: true
  measure_level_during_speech: true
  duck_under_speech: true
  volume_percent_is_not_decibel: true

ending:
  style: "natural-hold-then-freeze-brand-fade"
  duration_sec: null
  no_reverse_or_looped_person: true

assets:
  - id: procedural-background-grid
    type: procedural
    bundled_file: null
    license: "parameters-in-this-file"
    source: "Generated from colors and layout in this style file. No third-party bitmap or audio is bundled."
    usage: "background and grid"
  - id: typography-and-music
    type: external-optional
    bundled_file: null
    license: "must-be-supplied-by-project"
    source: "No font file or music bed is included. The project must use a licensed font family and, if needed, a licensed or original instrumental."
    usage: "subtitles, titles, optional bed music"

# 可选镜头语言，不改变各品牌/项目默认；满屏仅在明确选择时执行。
broll:
  presentation: scene-plan
  fit: cover
  crop_policy: per-shot-subject-anchor
  speaker_overlay: scene-plan
  background: scene-plan
  padding: false
editorial_options:
  available_presentations: [windowed, full-bleed]
  full_bleed_notes: >
    满屏分支用等比源素材覆盖整个目标画布，不透出点阵、不画素材窗框、不拉伸或模糊补边；
    可保留小圆口播人物、降低安全区主标题与白色句字幕。每镜裁切及头像避让须重测，非固定坐标。
  layouts: [large-presenter, small-circle-broll, small-circle-information-mg, center-circle-emphasis]
  graphics: [numbered-steps, horizontal-relations, feedback-cycle, grouped-needs]
  selection: 内容与直接参考比较决定，不复制配色了事，不设镜头数/固定间隔，不反复套同一树图。
disclosure:
  policy: risk-based
  clean_preference: false
  provenance_manifest_required: true
